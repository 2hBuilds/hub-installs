name: hub health

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      drill:
        description: "Send a test alert: opens and closes one test issue"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# the same group as daily.yml, so the two never push at once
concurrency:
  group: daily-installs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # a hung run would hold the group daily.yml shares for GitHub's default six hours
    timeout-minutes: 10
    steps:
      # the branch tip when the run starts, not the sha it was queued with: a run that waited
      # behind the other workflow would otherwise miss its push and fail to rebase
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      # the page's "Live change, 24 hours" row; never stops the health check, and a run that fails
      # here leaves one hour without a reading. From 12:00 UTC it also records the day when the daily
      # job has not (GitHub sometimes skips a scheduled run), so no day goes missing.
      - name: Record the hourly install counts
        continue-on-error: true
        timeout-minutes: 3
        run: python3 fetch_installs.py --hourly

      - name: Check the Plugin Hub
        id: health
        run: python3 check_health.py --actions-out "$RUNNER_TEMP/health-actions.json"

      # a failure here keeps the health files out of the commit, so the next run sees the same
      # change and tries again
      - name: Open or close alert issues
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 check_health.py --apply "$RUNNER_TEMP/health-actions.json"

      # every hour for data/hourly.csv, even after a failed check; the health files only when
      # their status changed and the issues were opened or closed
      - name: Commit if the data changed
        if: ${{ !cancelled() }}
        env:
          SUMMARY: ${{ steps.health.outputs.summary }}
          HEALTH_CHANGED: ${{ steps.health.outputs.changed == 'true' && steps.apply.outcome == 'success' }}
        run: |
          if [ "$HEALTH_CHANGED" = "true" ]; then
            git add data/health.json data/health-log.csv
          else
            # not committed, so put back: pull --rebase refuses a tree with unstaged changes
            for f in data/health.json data/health-log.csv; do
              git checkout -- "$f" 2>/dev/null || rm -f "$f"
            done
          fi
          git add data/hourly.csv 2>/dev/null || true
          # the day's files, when the hourly reading caught up a day the daily job missed
          git add data/installs.csv data/latest.json data/all 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change in data/."
            exit 0
          fi
          if ! git diff --cached --quiet -- data/health.json data/health-log.csv; then
            message="health: $SUMMARY"
          elif ! git diff --cached --quiet -- data/installs.csv; then
            message="installs $(date -u +%Y-%m-%d) (caught up by the hourly run)"
          else
            message="installs hourly $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$message"
          # someone may have pushed to main (a plugins.txt edit) while this ran
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # by hand only, with the box ticked: a scheduled run has no inputs, so inputs.drill is not true there;
      # success() keeps it from running after a failed step, and a skipped commit step is not a failure
      - name: Fire drill
        if: success() && github.event_name == 'workflow_dispatch' && inputs.drill == true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 check_health.py --drill
