name: hub health

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# the same group as daily.yml, so the two never push at once
concurrency:
  group: daily-installs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # a hung run would hold the group daily.yml shares for GitHub's default six hours
    timeout-minutes: 10
    steps:
      # the branch tip when the run starts, not the sha it was queued with: a run that waited
      # behind the other workflow would otherwise miss its push and fail to rebase
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check the Plugin Hub
        id: health
        run: python3 check_health.py --actions-out "$RUNNER_TEMP/health-actions.json"

      # a failure here skips the commit, so the next run sees the same change and tries again
      - name: Open or close alert issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 check_health.py --apply "$RUNNER_TEMP/health-actions.json"

      - name: Commit if the health changed
        if: steps.health.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.health.outputs.summary }}
        run: |
          git add data/health.json data/health-log.csv
          if git diff --cached --quiet; then
            echo "No change in the health files."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "health: $SUMMARY"
          # someone may have pushed to main (a plugins.txt edit) while this ran
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
