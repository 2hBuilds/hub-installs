<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin Hub installs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
	:root {
		--bg: #232323;
		--card: #171717;
		--text: #ffffff;
		--muted: #a8a8a8;
		--line: #2e2e2e;
		--accent: rgb(220, 138, 0);
		--rise: rgb(38, 168, 49);
		--fall: rgb(196, 48, 48);
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: var(--bg);
		color: var(--text);
		font-family: Lato, sans-serif;
		font-size: 15px;
	}
	main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
	h1 { font-size: 24px; margin: 0 0 4px; }
	h2 { font-size: 16px; margin: 0 0 12px; }
	.note { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
	.card { background: var(--card); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
	.ranges { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
	.ranges button {
		font: inherit;
		font-size: 13px;
		color: var(--text);
		background: transparent;
		border: 1px solid var(--line);
		border-radius: 4px;
		padding: 4px 12px;
		cursor: pointer;
	}
	.ranges button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
	.chart { position: relative; height: 320px; }
	.plugins .card { margin-bottom: 0; }
	.plugins { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
	.plugins h2 { display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
	.swatch { width: 12px; height: 3px; border-radius: 2px; flex: none; }
	table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
	th { text-align: left; font-weight: 400; color: var(--muted); padding: 6px 0; }
	td { text-align: right; padding: 6px 0; }
	tr + tr th, tr + tr td { border-top: 1px solid var(--line); }
	.rise { color: var(--rise); }
	.fall { color: var(--fall); }
	.blank { color: var(--muted); }
	.live { color: var(--muted); font-size: 13px; margin-left: 6px; }
	.health { margin-bottom: 16px; }
	.health-line { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: 13px; margin: 0 0 8px; overflow-wrap: anywhere; }
	.health-line.pending { color: var(--accent); }
	.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 5px; background: var(--rise); }
	.pending .dot { background: var(--accent); }
	.none .dot { background: var(--muted); }
	.health .card { border: 1px solid var(--fall); margin-bottom: 8px; }
	.health .card h2 { color: var(--fall); }
	.health-row { padding: 8px 0; overflow-wrap: anywhere; }
	.health-row + .health-row { border-top: 1px solid var(--line); }
	.health-row p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
	<h1>Plugin Hub installs</h1>
	<p class="note" id="note">Loading...</p>
	<div class="health" id="health" hidden></div>

	<section class="card">
		<div class="ranges" id="ranges" role="group" aria-label="Time range">
			<button type="button" data-days="7">7d</button>
			<button type="button" data-days="30">30d</button>
			<button type="button" data-days="90">90d</button>
			<button type="button" data-days="365">1y</button>
			<button type="button" data-days="0">all</button>
		</div>
		<div class="chart"><canvas id="chart" aria-label="Installs per day for each tracked plugin"></canvas></div>
	</section>

	<section class="plugins" id="plugins"></section>
</main>

<script>
// Fixed order, checked for colour-blind separation on the #171717 card; a sixth
// plugin and beyond reuse the hues with a dashed line so no two series look alike.
const COLOURS = ["rgb(220,138,0)", "#3987e5", "#199e70", "#9085e9", "#d55181"];
const DAY = 86400000;

const toTime = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
const toDate = t => new Date(t).toISOString().slice(0, 10);
const fmt = n => n.toLocaleString("en-US");
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));

function parseSeries(text) {
	// date,plugin,installs -> {slug: {date: installs or null}}
	const series = {};
	for (const line of text.trim().split(/\r?\n/).slice(1)) {
		const [date, slug, raw] = line.split(",");
		if (!date || !slug) continue;
		(series[slug] = series[slug] || {})[date] = raw === "" || raw === undefined ? null : Number(raw);
	}
	return series;
}

// The value on the latest day at or before `date` that has one.
function valueAtOrBefore(byDate, date) {
	const days = Object.keys(byDate).filter(d => d <= date && byDate[d] !== null).sort();
	return days.length ? byDate[days[days.length - 1]] : null;
}

function change(byDate, lastDate, days) {
	const now = byDate[lastDate];
	const then = valueAtOrBefore(byDate, toDate(toTime(lastDate) - days * DAY));
	return now === null || now === undefined || then === null ? null : now - then;
}

function changeCell(value) {
	if (value === null) return '<td class="blank"></td>';
	const cls = value > 0 ? "rise" : value < 0 ? "fall" : "";
	return `<td class="${cls}">${signed(value)}</td>`;
}

function swatch(i) {
	const c = COLOURS[i % COLOURS.length];
	return i < COLOURS.length ? c : `repeating-linear-gradient(90deg, ${c} 0 4px, transparent 4px 6px)`;
}

// The quiet marker after a live figure; "last live" once a later read has failed. The time
// is when this browser read the feed, which may have come from a cache up to 30 minutes old.
function liveMarker(current, withTime) {
	if (!current) return "";
	const text = liveFailed ? "last live" : "live";
	const title = `Read from RuneLite ${current.version} at ${timeOf(current.at)}; `
		+ "RuneLite's feed can be up to 30 minutes older than that";
	return `<span class="live" title="${esc(title)}">${esc(withTime ? `${text}${liveFailed ? " " : ", "}${timeOf(current.at)}` : text)}</span>`;
}

const sum = list => list.reduce((a, n) => a + (n || 0), 0);

// The Total card's change rows: the recorded sum on the last date minus the recorded sum on the
// look-back date. A plugin with nothing yet on that date had not started and counts as 0; the row
// is blank only when none of them had started.
function totalChange(series, slugs, lastDate, days) {
	const then = slugs.map(s => valueAtOrBefore(series[s], toDate(toTime(lastDate) - days * DAY)));
	return then.every(n => n === null) ? null : sum(slugs.map(s => series[s][lastDate])) - sum(then);
}

// The card ahead of the plugins when two or more are shown: the live figures added up when every
// plugin has one, else the recorded figures of the last date. No Hub rank, that is per plugin.
function totalCard(series, slugs, lastDate, current) {
	const now = sum(slugs.map(s => series[s][lastDate]));
	const liveSum = current && slugs.every(s => current.counts.has(s)) ? sum(slugs.map(s => current.counts.get(s))) : null;
	const since = liveSum !== null && liveSum !== now ? liveSum - now : null;
	const card = document.createElement("section");
	card.className = "card";
	card.innerHTML = `
		<h2><span class="swatch" style="background:var(--text)"></span><span>Total</span></h2>
		<table>
			<tr><th>Installs</th><td>${fmt(liveSum === null ? now : liveSum)}${liveSum === null ? "" : liveMarker(current, true)}</td></tr>
			${since === null ? "" : `<tr><th>Since the daily reading</th>${changeCell(since)}</tr>`}
			<tr><th>Change, 1 day</th>${changeCell(totalChange(series, slugs, lastDate, 1))}</tr>
			<tr><th>Change, 7 days</th>${changeCell(totalChange(series, slugs, lastDate, 7))}</tr>
			<tr><th>Change, 30 days</th>${changeCell(totalChange(series, slugs, lastDate, 30))}</tr>
		</table>`;
	return card;
}

// `current` is the live read in use ({counts: Map, at, version}) or null for the recorded
// numbers. Installs and Hub rank follow it; the change rows are always the recorded daily series.
function renderCards(series, slugs, lastDate, latest, current) {
	const all = current ? [...current.counts.values()] : Object.values(latest.counts);
	const marker = liveMarker(current, true);
	const holder = document.getElementById("plugins");
	holder.innerHTML = "";
	if (slugs.length > 1) holder.appendChild(totalCard(series, slugs, lastDate, current));
	slugs.forEach((slug, i) => {
		const byDate = series[slug];
		const now = byDate[lastDate];
		const count = current ? current.counts.get(slug) : latest.counts[slug];
		const shown = current ? count : now;
		const rank = count === undefined ? null : 1 + all.filter(n => n > count).length;
		const since = current && Number.isInteger(count) && Number.isInteger(now) && count !== now ? count - now : null;
		const card = document.createElement("section");
		card.className = "card";
		card.innerHTML = `
			<h2><span class="swatch" style="background:${swatch(i)}"></span><span></span></h2>
			<table>
				<tr><th>Installs</th><td>${shown === null || shown === undefined ? '<span class="blank">not in the feed</span>' : fmt(shown)}${marker}</td></tr>
				${since === null ? "" : `<tr><th>Since the daily reading</th>${changeCell(since)}</tr>`}
				<tr><th>Change, 1 day</th>${changeCell(change(byDate, lastDate, 1))}</tr>
				<tr><th>Change, 7 days</th>${changeCell(change(byDate, lastDate, 7))}</tr>
				<tr><th>Change, 30 days</th>${changeCell(change(byDate, lastDate, 30))}</tr>
				<tr><th>Hub rank</th><td>${rank === null ? '<span class="blank">-</span>' : `${fmt(rank)} of ${fmt(all.length)}${liveMarker(current, false)}`}</td></tr>
			</table>`;
		card.querySelector("h2 span:last-child").textContent = slug;
		holder.appendChild(card);
	});
}

let chart;

function renderChart(series, slugs, firstDate, lastDate, days) {
	const start = days ? Math.max(toTime(firstDate), toTime(lastDate) - (days - 1) * DAY) : toTime(firstDate);
	const labels = [];
	for (let t = start; t <= toTime(lastDate); t += DAY) labels.push(toDate(t));
	const dense = labels.length <= 60;
	const datasets = slugs.map((slug, i) => ({
		label: slug,
		data: labels.map(d => series[slug][d] ?? null),
		borderColor: COLOURS[i % COLOURS.length],
		backgroundColor: COLOURS[i % COLOURS.length],
		borderDash: i >= COLOURS.length ? [6, 4] : [],
		borderWidth: 2,
		pointRadius: labels.length === 1 ? 5 : dense ? 3 : 0,
		pointHoverRadius: 5,
		pointBorderColor: "#171717",
		pointBorderWidth: 2,
		spanGaps: false,
		tension: 0
	}));
	if (chart) chart.destroy();
	chart = new Chart(document.getElementById("chart"), {
		type: "line",
		data: { labels, datasets },
		options: {
			maintainAspectRatio: false,
			animation: false,
			interaction: { mode: "index", intersect: false },
			plugins: {
				legend: { display: slugs.length > 1, labels: { color: "#ffffff", boxHeight: 2 } },
				tooltip: {
					callbacks: {
						label: c => ` ${c.dataset.label}: ${c.raw === null ? "no data" : fmt(c.raw)}`
					}
				}
			},
			scales: {
				x: { offset: labels.length === 1, ticks: { color: "#a8a8a8", maxRotation: 0, autoSkip: true, autoSkipPadding: 24, maxTicksLimit: 6 }, grid: { display: false } },
				y: {
					ticks: { color: "#a8a8a8", precision: 0, callback: v => fmt(v) },
					grid: { color: "#2e2e2e" },
					border: { display: false }
				}
			}
		}
	});
}

async function load() {
	const note = document.getElementById("note");
	try {
		const [csvText, latest] = await Promise.all([
			fetch("data/installs.csv", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("data/installs.csv: " + r.status); return r.text(); }),
			fetch("data/latest.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("data/latest.json: " + r.status); return r.json(); })
		]);
		const series = parseSeries(csvText);
		const dates = [...new Set(Object.values(series).flatMap(Object.keys))].sort();
		if (!dates.length) {
			note.textContent = "No data yet.";
			return;
		}
		const firstDate = dates[0], lastDate = dates[dates.length - 1];
		// Every run writes a row for each slug in plugins.txt, so the slugs with a row on
		// the last day are the ones tracked now; a removed plugin drops off the page.
		const slugs = Object.keys(series).filter(s => lastDate in series[s]);
		recorded = {
			series, slugs, lastDate, latest,
			note: `Latest data: ${latest.date} (UTC), RuneLite ${latest.version}, `
				+ `${fmt(Object.keys(latest.counts).length)} plugins on the Hub. `
				+ `History from ${firstDate}.`
		};
		draw();
		const buttons = document.querySelectorAll("#ranges button");
		const show = days => {
			buttons.forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.days === days)));
			renderChart(series, slugs, firstDate, lastDate, days);
		};
		buttons.forEach(b => b.addEventListener("click", () => show(+b.dataset.days)));
		// "all" while the history is short, the last year once it is longer than that
		show(toTime(lastDate) - toTime(firstDate) < 365 * DAY ? 0 : 365);
		// only once the recorded page is drawn, and not awaited: a RuneLite that never
		// answers leaves the page exactly as it is
		readLive();
	} catch (e) {
		note.textContent = "Could not load the data (" + e.message + "). The page must be served over http, not opened as a file.";
	}
}

// Live numbers: after the recorded page is drawn, this browser reads the same two URLs
// fetch_installs.py reads, and the cards' Installs and Hub rank show what they say now.
// The chart and the change rows stay the daily recording: those readings are taken at
// the same hour each day, and the counts wobble through the day.
const BOOTSTRAP_URL = "https://static.runelite.net/bootstrap.json";
const LIVE_EVERY_MS = 30 * 60 * 1000;    // the feed's own max-age; never read more often
const LIVE_KEEP_MS = 2 * 60 * 60 * 1000; // no good read for this long: back to the recorded numbers
const LIVE_TIMEOUT_MS = 30 * 1000;
const VERSION = /^[A-Za-z0-9][A-Za-z0-9._+-]{0,39}$/;

let recorded = null;     // {series, slugs, lastDate, latest, note} from data/
let live = null;         // the last good live read: {counts: Map, at, version, fromBootstrap}
let liveFailed = false;  // the read after it failed
let lastTry = 0, reading = false, readTimer = 0, expireTimer = 0;

const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const timeOf = t => new Date(t).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const liveNow = () => live && Date.now() - live.at < LIVE_KEEP_MS ? live : null;

function draw() {
	const { series, slugs, lastDate, latest, note } = recorded;
	const current = liveNow();
	// the version is named so a read that fell back to the recorded one is not mistaken for current
	const from = !current ? "" : `RuneLite ${current.version}${current.fromBootstrap ? "" : " (the recorded version)"}`;
	document.getElementById("note").textContent = note + (!current ? ""
		: liveFailed ? ` Installs and rank on the cards are live from ${from} as of ${timeOf(current.at)}; RuneLite has not answered since.`
		: ` Installs and rank on the cards are live from ${from}, read ${timeOf(current.at)}.`);
	renderCards(series, slugs, lastDate, latest, current);
}

// A plain GET with no custom header, so no CORS preflight, and through the browser's
// HTTP cache, so RuneLite's max-age is honoured. The signal only ends a hung request.
async function getJson(url) {
	const stop = new AbortController();
	const timer = setTimeout(() => stop.abort(), LIVE_TIMEOUT_MS);
	try {
		const r = await fetch(url, { signal: stop.signal });
		if (!r.ok) throw new Error(url + ": " + r.status);
		return await r.json();
	} finally {
		clearTimeout(timer);
	}
}

// fetch_installs.client_version: the first artifact whose name starts with "client",
// its "version" field when present, else the version in a name like client-1.13.0.jar
function clientVersion(bootstrap) {
	const artifacts = bootstrap && typeof bootstrap === "object" ? bootstrap.artifacts : null;
	if (!Array.isArray(artifacts)) return null;
	for (const a of artifacts) {
		const name = a && typeof a === "object" ? a.name : null;
		if (typeof name !== "string" || !name.startsWith("client")) continue;
		if (a.version) return String(a.version);
		const match = /^client-(.+)\.jar$/.exec(name);
		return match ? match[1] : null;
	}
	return null;
}

// only a version that is safe inside a URL path is ever used
const safeVersion = v => typeof v === "string" && VERSION.test(v) ? v : null;

// fetch_installs.parse_counts: a non-empty object whose every value is a non-negative
// integer; one bad value rejects the whole feed
function parseCounts(feed) {
	if (!feed || typeof feed !== "object" || Array.isArray(feed)) return null;
	const counts = new Map(Object.entries(feed));
	if (!counts.size) return null;
	for (const n of counts.values()) if (!Number.isInteger(n) || n < 0) return null;
	return counts;
}

async function readLive() {
	if (reading) return;
	reading = true;
	lastTry = Date.now();
	try {
		let version = null;
		try {
			version = safeVersion(clientVersion(await getJson(BOOTSTRAP_URL)));
		} catch (e) {
			// fall back to the version of the daily recording
		}
		const fromBootstrap = !!version;
		version = version || safeVersion(recorded.latest.version);
		if (!version) throw new Error("no client version");
		const counts = parseCounts(await getJson(`https://api.runelite.net/runelite-${encodeURIComponent(version)}/pluginhub`));
		if (!counts) throw new Error("the pluginhub feed has a bad count");
		live = { counts, at: Date.now(), version, fromBootstrap };
		liveFailed = false;
	} catch (e) {
		// the last good read stays, marked with its time, until LIVE_KEEP_MS
		liveFailed = true;
	} finally {
		reading = false;
	}
	draw();
	schedule();
}

// The next read LIVE_EVERY_MS after the last one, and none while the tab is hidden;
// and a redraw when the last good read grows too old, so it drops back to the recording.
function schedule() {
	clearTimeout(readTimer);
	clearTimeout(expireTimer);
	if (live) expireTimer = setTimeout(draw, Math.max(0, live.at + LIVE_KEEP_MS - Date.now()) + 1000);
	if (reading || document.visibilityState === "hidden") return;
	readTimer = setTimeout(readLive, Math.max(0, lastTry + LIVE_EVERY_MS - Date.now()));
}

// back in view: redraw (an old live read may have expired) and read at once if one is due
document.addEventListener("visibilitychange", () => {
	if (!recorded || !lastTry) return;
	if (document.visibilityState === "visible") draw();
	schedule();
});

const STATUS_WORDS = { pending: "waiting for a jar", unavailable: "unavailable", missing: "missing from the Plugin Hub" };
// a healthy repository refreshes checkedAt at least daily (the daily install run checks too)
const STALE_MS = 36 * 60 * 60 * 1000;
const localTime = iso => {
	if (typeof iso !== "string" || !iso) return "";
	const d = new Date(iso);
	return isNaN(d) ? "" : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
};

function element(tag, cls, text) {
	const e = document.createElement(tag);
	if (cls) e.className = cls;
	if (text !== undefined) e.textContent = text;
	return e;
}

function dotLine(cls, text) {
	const line = element("p", "health-line " + cls);
	line.append(element("span", "dot"), element("span", "", text));
	return line;
}

// data/health.json is written by check_health.py; without it the strip stays hidden.
// A file that says nothing is watched, or whose check is old, says so rather than looking fine.
async function loadHealth() {
	const holder = document.getElementById("health");
	try {
		const r = await fetch("data/health.json", { cache: "no-cache" });
		if (!r.ok) return;
		const health = await r.json();
		const plugins = (Array.isArray(health.plugins) ? health.plugins : []).filter(p => p && typeof p.slug === "string");
		const checked = localTime(health.checkedAt);
		const stale = !(Date.now() - Date.parse(health.checkedAt) <= STALE_MS);
		const when = `RuneLite ${String(health.version)} - checked ${checked || "at an unknown time"}`;
		const name = p => String(p.name || p.slug);
		const down = plugins.filter(p => p.status !== "ok" && p.status !== "pending");
		const pending = plugins.filter(p => p.status === "pending");
		const parts = [];
		if (down.length) {
			const panel = element("section", "card");
			panel.append(element("h2", "", "Unavailable on the Plugin Hub"));
			for (const p of down) {
				const row = element("div", "health-row");
				const head = element("div");
				head.append(element("strong", "", name(p)), document.createTextNode(" - "),
					element("span", "fall", STATUS_WORDS[p.status] || String(p.status)));
				row.append(head);
				if (p.reason) row.append(element("p", "", String(p.reason)));
				if (localTime(p.since)) row.append(element("p", "", "Since " + localTime(p.since)));
				panel.append(row);
			}
			parts.push(panel);
		}
		for (const p of pending) {
			parts.push(dotLine("pending", `${name(p)}: ${p.reason ? String(p.reason) : "no jar on the Plugin Hub yet"}`));
		}
		if (stale) {
			parts.push(dotLine("pending", checked
				? `Not checked since ${checked} - the availability check may have stopped`
				: "No time of the last check - the availability check may have stopped"));
		} else if (!plugins.length) {
			parts.push(dotLine("none", `No plugins watched - ${when}`));
		} else if (!parts.length) {
			const n = plugins.length;
			parts.push(dotLine("ok", `${n === 1 ? "1 plugin" : `All ${n} plugins`} available on the Plugin Hub - ${when}`));
		} else {
			parts.push(element("p", "health-line", when));
		}
		holder.replaceChildren(...parts);
		holder.hidden = false;
	} catch (e) {
		holder.replaceChildren();
		holder.hidden = true;
	}
}

load();
loadHealth();
</script>
</body>
</html>
